[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcheck-workbench"
version = "0.3.0"
description = "Gemini instruction testing with context uploads and evidence reports"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.3", "vercel-workflow==0.11.2", "vercel-blob==0.5.0", "uvicorn==0.54.0"]
license = {text = "GPL-3.0-only"}

[tool.setuptools.packages.find]
include = ["agentcheck*"]

[tool.setuptools.package-data]
agentcheck = ["web/*"]

[tool.vercel]
entrypoint = "app:app"

[[tool.vercel.workflows]]
entrypoint = "agentcheck.hosted_jobs:wf"
